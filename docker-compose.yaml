services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: congestion_tax
      POSTGRES_USER: congestion_tax
      POSTGRES_PASSWORD: congestion_tax
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
